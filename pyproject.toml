[project]
name = "gtfs-explorer-desktop"
dynamic = ["version"]
description = "Aplicación Windows portable y offline-first para explorar GTFS Schedule"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.1.3",
    "nuitka==2.6.9",
    "PySide6==6.8.3",
    "shapely==2.1.2",
]

[project.scripts]
gtfs-explorer = "gtfs_explorer.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gtfs_explorer.product.PRODUCT_VERSION"}

[tool.setuptools.package-data]
"gtfs_explorer.resources.help" = ["*.json"]
"gtfs_explorer.resources.i18n" = ["*.json"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.9.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: prueba aislada sin servicios ni interfaz gráfica",
    "integration: prueba que integra más de un componente local",
    "e2e: journey de usuario sobre la arquitectura productiva y recursos locales aislados",
]
